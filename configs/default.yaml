# =============================================================================
# Hybrid QML Pneumonia Detection — default configuration
# Mirror of the Config dataclass in pipeline/config.py (T2 exact spec).
# Precedence: defaults < YAML < CLI args.
# =============================================================================

# -----------------------------------------------------------------------------
# Project
# -----------------------------------------------------------------------------
project_name: "HybridConvNeXtTinyQNNPneumonia"
seed: 6
device: "auto"  # "auto" = select least-loaded GPU

# -----------------------------------------------------------------------------
# Data
# -----------------------------------------------------------------------------
dataset: "paultimothymooney/chest-xray-pneumonia"
dataset_path: ""  # manual override for pre-downloaded dataset
img_size: 224
val_split: 0.20

# -----------------------------------------------------------------------------
# Augmentation
# -----------------------------------------------------------------------------
rotation_deg: 7.0
translate: 0.05
color_jitter_brightness: 0.2
color_jitter_contrast: 0.2

# -----------------------------------------------------------------------------
# Feature extraction
# -----------------------------------------------------------------------------
backbone: "convnext_tiny"
feature_dim: 768
dann_epochs: 10
dann_lr: 1e-4
use_dann: true

# -----------------------------------------------------------------------------
# VAE / SVAE
# -----------------------------------------------------------------------------
reduction_method: "vae"  # "vae" | "svae"
target_dims: 64
vae_beta: 0.001
vae_lambda_clf: 0.01
vae_lambda_coral: 0.0
vae_epochs: 30
vae_batch_size: 32
vae_lr: 1e-3

# -----------------------------------------------------------------------------
# VQC
# -----------------------------------------------------------------------------
n_qubits: 6
n_layers: 3
use_learnable_scale: true    # True contributes 6 params
use_measurement_basis: true  # True contributes 2 params
diff_method: "adjoint"

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
batch_size: 16
learning_rate: 1e-3
lr_min: 1e-5
warmup_epochs: 3
epochs: 50
early_stopping_patience: 10  # AGENTS.md spec (notebook used 3)

# -----------------------------------------------------------------------------
# Domain adaptation
# -----------------------------------------------------------------------------
lambda_coral: 0.1
mixup_alpha: 0.2

# -----------------------------------------------------------------------------
# MLP baseline
# -----------------------------------------------------------------------------
mlp_hidden: 32
mlp_dropout: 0.3

# -----------------------------------------------------------------------------
# QPU
# -----------------------------------------------------------------------------
run_mode: "sim"  # "sim" | "qpu" | "both"
ibm_token: ""
ibm_instance: "ibm-q/open/main"
ibm_backend: ""  # "" = auto-select least-busy Heron
n_qpu_shots: 1024

# -----------------------------------------------------------------------------
# ZNE
# -----------------------------------------------------------------------------
zne_scale_factors: [1, 2, 3]

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
threshold_range_min: 0.30
threshold_range_max: 0.80
threshold_step: 0.025
n_bootstrap: 1000

# -----------------------------------------------------------------------------
# Cross-validation
# -----------------------------------------------------------------------------
cv_folds: 5

# -----------------------------------------------------------------------------
# Paths (relative to repo root — NO hardcoded /content/*)
# -----------------------------------------------------------------------------
artifacts_dir: "artifacts"
results_dir: "results"
figures_dir: "figures"

# -----------------------------------------------------------------------------
# GPU auto-selection
# -----------------------------------------------------------------------------
gpu_strategy: "least_loaded"  # "least_loaded" | "manual"
cuda_device: ""  # manual CUDA_VISIBLE_DEVICES override